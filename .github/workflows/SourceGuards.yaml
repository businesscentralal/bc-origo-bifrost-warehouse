name: Source Guards

# Source rules that the AL compiler cannot check, the same guards Bifrost Foundation runs (copied from
# bc-origo-bifrost-core/tools, 05.10.2026): an error response never carries the AL call stack, every caller-supplied
# tableView is validated before SetView, the parameter names a contract declares are the keys the code reads and the
# other way round, nothing is declared obsolete, every page, query and report is granted by an assignable permission
# set, no answer mixes a Locked English sentence with translated text, and every Icelandic keyword list is complete.
# Contract parameter keys (#24) and mixed-language labels (#27) run in full since the contract batch (#61) made main clean.
# The Icelandic xlf check (tools/Test-IcelandicXlfInSync.ps1, #26) needs the compiler's g.xlf: its self-test runs here,
# the full comparison is run by hand after a compile before a PR.
# Help links (tools/Test-HelpLinks.ps1, #25) stay unwired: the app has no pages and the docs site creates no
# help/warehouse folder for an app without pages (bifrost#109).
# Unique object IDs, build inputs and the symbol-alias gate were ported from Bifrost Inventory/Attachments (19.10.2026);
# the AppSource build gate itself runs inside the AL-Go build (tools/AppSourceBuildGate.md).

on:
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/Translations/**'
      - 'tools/**'
      - '.github/workflows/SourceGuards.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  NoClientCallstack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No call stack in client responses
        shell: pwsh
        run: ./tools/Test-NoClientCallstack.ps1

  ValidatedTableView:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Every applied tableView is validated first
        shell: pwsh
        run: ./tools/Test-ValidatedTableView.ps1


  NoObsolete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The guard checks itself
        shell: pwsh
        run: ./tools/Test-NoObsolete.ps1 -SelfTest

      - name: Nothing obsolete in the app
        shell: pwsh
        run: ./tools/Test-NoObsolete.ps1

  PermissionCoverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The guard checks itself
        shell: pwsh
        run: ./tools/Test-PermissionCoverage.ps1 -SelfTest

      - name: Every page and query is granted by a permission set
        shell: pwsh
        run: ./tools/Test-PermissionCoverage.ps1



  UniqueObjectIds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The guard checks itself
        shell: pwsh
        run: ./tools/Test-UniqueObjectIds.ps1 -SelfTest

      - name: No object or enum value ID is declared twice in the app
        shell: pwsh
        run: ./tools/Test-UniqueObjectIds.ps1

      - name: No object or enum value ID is declared twice in the test app
        shell: pwsh
        run: ./tools/Test-UniqueObjectIds.ps1 -AppFolder ./test

  BuildInputs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Object allocations and the Foundation floor
        run: |
          python3 -m unittest discover -s tools/tests -p test_build_inputs.py -v
          python3 tools/check_build_inputs.py --root .

  SymbolDuplicateGate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Equivalent compiler symbol aliases
        run: |
          python3 -m unittest discover -s tools/tests -p test_symbol_duplicates.py -v
          python3 -m unittest discover -s tools/tests -p test_foundation_restore.py -v

  ContractParameterKeys:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The guard checks itself
        shell: pwsh
        run: ./tools/Test-ContractParameterKeys.ps1 -SelfTest

      - name: Every contract parameter is read and every read key is declared
        shell: pwsh
        run: ./tools/Test-ContractParameterKeys.ps1

  MixedLanguageLabels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The guard checks itself
        shell: pwsh
        run: ./tools/Test-MixedLanguageLabels.ps1 -SelfTest

      - name: No answer mixes a Locked English sentence with translated text
        shell: pwsh
        run: ./tools/Test-MixedLanguageLabels.ps1

  IcelandicXlfInSync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The xlf guard checks itself (the full check needs a compile)
        shell: pwsh
        run: ./tools/Test-IcelandicXlfInSync.ps1 -SelfTest

  IcelandicKeywordCounts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The guard checks itself
        shell: pwsh
        run: ./tools/Test-IcelandicKeywordCounts.ps1 -SelfTest

      - name: Every Icelandic keyword list is complete
        shell: pwsh
        run: ./tools/Test-IcelandicKeywordCounts.ps1
